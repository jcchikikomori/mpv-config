# autosub — automatic subtitle download via subliminal
#
# Override any value here; the Lua defaults are sensible for most users.
# Lines starting with '#' are comments.

# auto=yes: auto-download on file load; no=manual only (Ctrl+Alt+b / Ctrl+Alt+n)
autosub_auto=yes

# Comma-separated ISO codes, paired 2-by-2 into (iso639-1, iso639-2).
# First pair wins; only download the next when the previous found nothing.
autosub_languages=en,eng,nl,dut

# Path to the subliminal binary. Empty = auto-discover from PATH, then a
# known venv fallback (/home/deck/.venv/global/bin/subliminal).
autosub_subliminal_path=

# Comma-separated provider list passed to subliminal. Defaults to the two
# providers that are actually alive (opensubtitlescom REST + podnapisi).
autosub_providers=opensubtitlescom,podnapisi

# Where subtitles are saved. Empty = ~/.cache/mpv/subtitles/<video-name>/
autosub_dir=

# Extra CLI tokens appended to the subliminal command before the file
# argument (whitespace-separated).
autosub_extra_args=

# Wall-clock budget in seconds; subliminal is cancelled after this.
autosub_timeout=30

# Comma-separated path substrings that disable auto-download.
autosub_excludes=no-subs-dl

# Comma-separated path substrings; if set, only matching paths download.
autosub_includes=

# debug=yes adds --debug to subliminal and extra terminal logging.
autosub_debug=no
